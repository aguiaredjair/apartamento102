# wrangler.toml (na pasta do Pages)

name = "apartamento102"
pages_build_output_dir = "."

compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Bindings do Karaokê (já existentes)
[[durable_objects.bindings]]
name = "KARAOKE_ROOM"
class_name = "KaraokeRoom"
script_name = "karaoke-do"

# Bindings do Chat apontando para o MESMO script
[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"
script_name = "karaoke-do"

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"
script_name = "karaoke-do"