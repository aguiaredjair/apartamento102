#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1.2rem 1rem;align-items:start}
.disco{ min-width:0;background:none;border:0;padding:0;text-align:center;font:inherit;color:inherit; -webkit-tap-highlight-color:transparent;display:block;position:relative;z-index:1; }
.disco:hover{ z-index:10; }

.disco:focus-visible .capa{outline:2px solid var(--accent);outline-offset:3px}
.capa{ position:relative;width:100%;min-width:0;aspect-ratio:1;overflow:hidden; display:grid;place-items:center;text-align:center;transition:transform .2s, border-radius .25s; color:var(--mute);font-weight:700;font-size:.7rem;padding:.5rem;overflow-wrap:anywhere; background:transparent;border-radius:10px; }
.capa::before{ content:"";position:absolute;inset:0;background:var(--cor-disco, transparent); opacity:0;transition:opacity .2s;pointer-events:none;z-index:1;border-radius:inherit; }

.chat-container { display: flex; flex-direction: column; height: 100%; width: 100%; background: var(--bg); overflow: hidden;}
.chat-header { padding: 1rem 1.4rem; border-bottom: 1px solid rgba(34,32,29,.1); display: flex; justify-content: space-between; align-items: center; background: var(--card); flex-shrink: 0;}

async function checarUsuario() {
  if (!window.supabase) return;
  
  const { data: { session } } = await window.supabase.auth.getSession();
  
  if (session) {
    currentUser = session.user;
    const { data: profile } = await window.supabase
      .from('profiles')
      .select('*')
      .eq('id', session.user.id)
      .single();

    if (profile && profile.password_changed) {
      userProfile = profile;
      menuLogado.style.display = "block";
      menuDeslogado.style.display = "none";
      $("menu-user-name").textContent = profile.username;
      $("menu-user-avatar").src = profile.avatar_url || DEFAULT_AVATAR;
      conectarHub();
    } else {
      userProfile = null;
      menuLogado.style.display = "none";
      menuDeslogado.style.display = "block";
      abrirConfiguracoes(true);
    }
  } else {
    currentUser = null;
    userProfile = null;
    menuLogado.style.display = "none";
    menuDeslogado.style.display = "block";
    if (wsHub) { wsHub.close(); wsHub = null; }
    usuariosOnline = [];
    if ($("modal-pessoas").open) abrirPessoas();
  }
}

async function setupAuth() {
  if (!window.supabase) { setTimeout(setupAuth, 100); return; }
  checarUsuario();
  window.supabase.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') checarUsuario();
  });
}

formLogin.onsubmit = async (e) => {
  e.preventDefault();
  loginMsg.textContent = "Buscando usuário...";
  loginMsg.style.color = "var(--mute)";

  const username = $("login-username").value.trim();
  const senha = $("login-senha").value;

  if (!window.supabase) return;

  const { data: email, error: rpcError } = await window.supabase.rpc('get_email_by_username', { p_username: username });

  if (rpcError || !email) {
    loginMsg.textContent = "Usuário não encontrado.";
    loginMsg.style.color = "#c0392b";
    return;
  }

  loginMsg.textContent = "Entrando...";

  const { data, error } = await window.supabase.auth.signInWithPassword({
    email: email,
    password: senha,
  });

  if (error) {
    loginMsg.textContent = "Senha incorreta.";
    loginMsg.style.color = "#c0392b";
  } else {
    loginMsg.textContent = "";
    formLogin.reset();
    fecharMenu();
  }
};

function conectarHub() {
  if (wsHub && wsHub.readyState === WebSocket.OPEN) return;

  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  wsHub = new WebSocket(`${protocolo}//${location.host}/api/chat/hub`);

  wsHub.onopen = () => {
    wsHub.send(JSON.stringify({ tipo: "auth", username: userProfile.username }));
  };

  wsHub.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      
      if (msg.tipo === "status_online") {
        usuariosOnline = msg.usuarios || [];
        if ($("modal-pessoas").open) abrirPessoas();
      }

      if (msg.tipo === "salas_atualizadas") {
        salasChat = msg.salas || [];
        desenhaChatSalas();
      }
    } catch (e) {}
  };

  wsHub.onclose = () => { setTimeout(conectarHub, 3000); };
}

function desenhaChatSalas() {
  const contagem = $("contagem-chat-salas");
  const lista = $("lista-chat-salas");
  if (!lista) return;
  
  contagem.textContent = `Mostrando ${salasChat.length} ${salasChat.length === 1 ? "sala" : "salas"}`;
  lista.innerHTML = "";

  if (salasChat.length === 0) {
    lista.innerHTML = '<p class="aviso">Nenhuma conversa ainda. Crie a primeira!</p>';
    return;
  }

  salasChat.forEach(sala => {
    const b = document.createElement("button");
    b.className = "chat-sala-item";
    
    const naoLidas = chatNaoLidas[sala.id] || 0;
    const badge = naoLidas > 0 ? `<span style="background:#c0392b; color:white; border-radius:10px; padding:2px 8px; font-size:0.75rem;">${naoLidas} nova(s)</span>` : '';

    b.innerHTML = `
      <div><b>${esc(sala.nome)}</b></div>
      <div style="display:flex; align-items:center; gap:0.5rem;">
        ${badge}
        <span>→</span>
      </div>
    `;
    b.onclick = () => abrirChatSala(sala);
    lista.append(b);
  });
}

  wsChatRoom.onmessage = async (event) => {
    try {
      const msg = JSON.parse(event.data);
      
      if (msg.tipo === "estado_inicial") {
        chatBody.innerHTML = "";
        msg.mensagens.forEach(m => renderizarMensagemChat(m));
        
        chamadaAtivaNoServidor = msg.chamadaAtiva;

          $("video-lobby-title").textContent = "Nenhuma chamada ativa";
          $("video-lobby-desc").textContent = "Inicie uma chamada de vídeo para os participantes da sala.";
          $("btn-lobby-action").textContent = "📹 Iniciar Chamada";
        }
      }

      if (msg.tipo === "nova_mensagem") renderizarMensagemChat(msg.mensagem);

      if (msg.tipo === "chamada_iniciada") {
        chamadaAtivaNoServidor = true;
        if (!naChamada) {
          $("video-lobby-title").textContent = "Chamada iniciada por " + msg.por;
          $("video-lobby-desc").textContent = "Você pode entrar na chamada agora.";
          $("btn-lobby-action").textContent = "📹 Entrar na Chamada";
        }
      }

      if (msg.tipo === "chamada_encerrada") {
        chamadaAtivaNoServidor = false;
        if (naChamada) {
          alert("A chamada foi encerrada porque todos saíram.");
          sairChamada(true);

          $("video-lobby-title").textContent = "Nenhuma chamada ativa";
          $("video-lobby-desc").textContent = "Inicie uma chamada de vídeo para os participantes da sala.";
          $("btn-lobby-action").textContent = "📹 Iniciar Chamada";
        }
      }

      // --- WebRTC Signaling ---
      if (msg.tipo === "peers_iniciais") {
        for (const peer of msg.peers) {
          const pc = await criarConexao(peer);
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          wsChatRoom.send(JSON.stringify({ tipo: "webrtc_offer", target: peer, sdp: offer }));
        }
      }

      if (msg.tipo === "peer_joined" && msg.username !== userProfile.username) {
        await criarConexao(msg.username);
      }

      if (msg.tipo === "peer_mic_state") {
        const el = document.getElementById(`video-${msg.username.replace(/\s+/g, '-').toLowerCase()}`);
        if (el) {
          const icon = el.querySelector('.mic-muted-icon');
          if (msg.muted) { if(!icon) el.insertAdjacentHTML('beforeend', `<div class="mic-muted-icon"><svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg></div>`); } 
          else { if(icon) icon.remove(); }
        }
      }

      if (msg.tipo === "webrtc_offer") {
        const pc = peerConnections[msg.sender] || await criarConexao(msg.sender);
        await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        wsChatRoom.send(JSON.stringify({ tipo: "webrtc_answer", target: msg.sender, sdp: answer }));
      }

      if (msg.tipo === "webrtc_answer") {
        const pc = peerConnections[msg.sender];
        if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      }

      if (msg.tipo === "webrtc_ice") {
        const pc = peerConnections[msg.sender];
        if (pc) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
      }

      if (msg.tipo === "peer_left") {
        const idSeguro = msg.username.replace(/\s+/g, '-').toLowerCase();
        if (peerConnections[idSeguro]) {
          peerConnections[idSeguro].close();
          delete peerConnections[idSeguro];
        }
        const el = document.getElementById(`video-${idSeguro}`);
        if (el) el.remove();
      }

    } catch (e) { console.error(e); }
  };

  const input = $("chat-input");
  const enviar = () => {
    const text = input.value.trim();
    if (!text) return;
    if (wsChatRoom && wsChatRoom.readyState === WebSocket.OPEN) {
      wsChatRoom.send(JSON.stringify({ tipo: "mensagem", text }));
      input.value = "";
    }
  };

  $("chat-send").onclick = enviar;
  input.onkeypress = (e) => { if (e.key === "Enter") enviar(); };

  modal.onclose = () => {
    if (wsChatRoom) { 
      wsChatRoom.send(JSON.stringify({ tipo: "sair_chamada", username: userProfile.username }));

      wsChatRoom = null;

    limparMidiaVideo();
    desenhaChatSalas();
  };
}

window.acaoLobbyVideo = async () => {
  if (!wsChatRoom || wsChatRoom.readyState !== WebSocket.OPEN) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    
    const videoTrack = stream.getVideoTracks()[0];
    if (videoTrack) { videoTrack.stop(); stream.removeTrack(videoTrack); }
    const audioTrack = stream.getAudioTracks()[0];
    if (audioTrack) { audioTrack.enabled = false; }
    
    localStream = stream;
    camAtiva = false;
    micAtivo = false;
    
    atualizarBotoesMidia();

    if (chamadaAtivaNoServidor) {
      wsChatRoom.send(JSON.stringify({ tipo: "entrar_chamada", username: userProfile.username }));
    } else {
      wsChatRoom.send(JSON.stringify({ tipo: "iniciar_chamada", username: userProfile.username }));
    }
    
    wsChatRoom.send(JSON.stringify({ tipo: "peer_mic_state", username: userProfile.username, muted: true }));
    
    naChamada = true;
    $("video-lobby").style.display = "none";
    $("chat-video-area").style.display = "flex";
    $("video-controls").style.display = "flex";
    
    criarJanelaVideo(userProfile.username, userProfile.avatar_url, true);

  } catch (err) {
    alert("Não foi possível acessar a câmera/microfone.");
  }
};

window.sairChamada = (forcado = false) => {
  if (!naChamada) return;

  if (!forcado && wsChatRoom && wsChatRoom.readyState === WebSocket.OPEN) {

function limparMidiaVideo() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
  for (const pc of Object.values(peerConnections)) pc.close();
  peerConnections = {};
  $("chat-video-area").innerHTML = "";
  
  camAtiva = false;
  micAtivo = false;
  atualizarBotoesMidia();
}

function atualizarBotoesMidia() {

    const iconeOn = btnMic.querySelector("#icone-mic-on");

    if (micAtivo) {

window.iniciarCamera = async () => {
  if (!naChamada) return;
  const idLocal = userProfile.username.replace(/\s+/g, '-').toLowerCase();

  if (camAtiva) {
    camAtiva = false;
    
    if (localStream) {
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) { videoTrack.stop(); localStream.removeTrack(videoTrack); }
    }
    
    for (const pc of Object.values(peerConnections)) {
      const senders = pc.getSenders();
      senders.forEach(s => { if(s.track && s.track.kind === 'video') pc.removeTrack(s); });
    }
    
    atualizarBotoesMidia();
    criarJanelaVideo(userProfile.username, userProfile.avatar_url, true);
  } else {
    try {
      const newStream = await navigator.mediaDevices.getUserMedia({ video: true });
      const videoTrack = newStream.getVideoTracks()[0];
      
      if (localStream) localStream.addTrack(videoTrack);
      else localStream = newStream;
      
      camAtiva = true;
      atualizarBotoesMidia();
      
      for (const pc of Object.values(peerConnections)) {
        pc.addTrack(videoTrack, localStream);
      }
      
      criarJanelaVideo(userProfile.username, userProfile.avatar_url, true, localStream);
    } catch (err) {
      alert("Não foi possível acessar a câmera.");
    }
  }
};

window.toggleCompartilharTela = async () => {
  if (!naChamada) return;
  const btn = $("btn-share-screen");
  const idLocal = userProfile.username.replace(/\s+/g, '-').toLowerCase();

  if (screenStream) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    btn.classList.remove("active");
    
    if (camAtiva && localStream) {
      criarJanelaVideo(userProfile.username, userProfile.avatar_url, true, localStream);
    } else {
      criarJanelaVideo(userProfile.username, userProfile.avatar_url, true);
    }
    
    for (const pc of Object.values(peerConnections)) {
      const senders = pc.getSenders();
      senders.forEach(s => { 
        if(s.track && s.track.kind === 'video') {
           if (camAtiva && localStream) {
             const camTrack = localStream.getVideoTracks()[0];
             if(camTrack) s.replaceTrack(camTrack);
           } else {
             pc.removeTrack(s);
           }
        } 
      });
    }
  } else {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      btn.classList.add("active");
      
      criarJanelaVideo(userProfile.username + " (Tela)", userProfile.avatar_url, true, screenStream);

      for (const pc of Object.values(peerConnections)) {
        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) sender.replaceTrack(screenTrack);
        else pc.addTrack(screenTrack, screenStream);
      }

      screenTrack.onended = () => { toggleCompartilharTela(); };
    } catch (err) {
      alert("Não foi possível compartilhar a tela.");
    }
  }
};

function criarJanelaVideo(username, avatarUrl, isLocal, stream = null) {
  const area = $("chat-video-area");
  if (!area) return;
  
  let idSeguro = username.replace(/\s+/g, '-').replace(/[()]/g, '').toLowerCase();
  
  if (username.includes("(Tela)")) {
      idSeguro = userProfile.username.replace(/\s+/g, '-').toLowerCase() + "-tela";
  }

  let wrapper = document.getElementById(`video-${idSeguro}`);
  
  if (!wrapper) {
    wrapper = document.createElement("div");
    wrapper.className = "video-wrapper";
    wrapper.id = `video-${idSeguro}`;
    wrapper.onclick = () => {
      document.querySelectorAll('.video-wrapper').forEach(w => w.classList.remove('focused'));
      wrapper.classList.add('focused');
    };
    area.appendChild(wrapper);
  }
  
  wrapper.innerHTML = '';

  if (stream) {
    const video = document.createElement("video");
    video.autoplay = true; video.playsInline = true; video.muted = isLocal;
    video.srcObject = stream;
    wrapper.appendChild(video);
  } else {
    wrapper.innerHTML = `<div class="video-avatar"><img src="${avatarUrl || DEFAULT_AVATAR}"></div>`;
  }

  const label = document.createElement("div");
  label.className = "video-label";
  label.textContent = username;
  wrapper.appendChild(label);

  if (isLocal && !micAtivo) {
    wrapper.insertAdjacentHTML('beforeend', `<div class="mic-muted-icon"><svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg></div>`);
  }
}

async function criarConexao(username) {
  const idSeguro = username.replace(/\s+/g, '-').replace(/[()]/g, '').toLowerCase();
  if (peerConnections[idSeguro]) return peerConnections[idSeguro];

  const pc = new RTCPeerConnection(iceServers);
  peerConnections[idSeguro] = pc;

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }
  if (screenStream) {
    screenStream.getTracks().forEach(track => pc.addTrack(track, screenStream));
  }

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      wsChatRoom.send(JSON.stringify({ tipo: "webrtc_ice", target: username, candidate: event.candidate }));
    }
  };

  pc.ontrack = (event) => {
    if (event.track.kind === 'video') {
        if (event.track.readyState === 'ended' || event.track.muted) {
            criarJanelaVideo(username, null, false); 
        } else {
            criarJanelaVideo(username, null, false, event.streams[0]);
        }
    }
  };

  setTimeout(() => {
      if (!document.getElementById(`video-${idSeguro}`)) {
          criarJanelaVideo(username, null, false);
      }
  }, 1000);

  return pc;
}

const cache = {
  get(k){ try{ return JSON.parse(localStorage.getItem("dc:"+k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem("dc:"+k, JSON.stringify(v)); }catch{} }
};
const chaveAlbum = d => "lf3:"+(d.artista+"|"+d.nome).toLowerCase();

async function infoAlbum(d){
  const c = cache.get(chaveAlbum(d)) || {capa: "", faixas: []};
  let capa = d.capa || c.capa;
  let faixas = (d.faixas && d.faixas.length) ? normalizaFaixas(d.faixas) : c.faixas;
  if (capa && faixas.length > 0) { cache.set(chaveAlbum(d), {capa, faixas}); return {capa, faixas}; }

  let lfCapa = "", lfFaixas = [];
  try {
    const u = `https://ws.audioscrobbler.com/2.0/?method=album.getInfo&api_key=${LASTFM_KEY}&artist=${encodeURIComponent(d.artista)}&album=${encodeURIComponent(d.nome)}&autocorrect=1&format=json`;
    const data = await (await fetch(u)).json();
    const a = data.album;
    if (a){
      const imgs = (a.image||[]).map(i => i["#text"]).filter(x => x && !x.includes("2a96cbd8b46e442fc41c2b86b821562f"));
      lfCapa = imgs[imgs.length-1]||"";
      lfFaixas = [].concat(a.tracks?.track||[]).map(t => ({n:t.name, s:Number(t.duration)||0}));
    }
  } catch {}

  const finalCapa = d.capa || capa || lfCapa;
  const finalFaixas = (d.faixas && d.faixas.length) ? normalizaFaixas(d.faixas) : (faixas.length > 0 ? faixas : lfFaixas);
  const r = {capa: finalCapa, faixas: finalFaixas};
  if (finalCapa || finalFaixas.length) cache.set(chaveAlbum(d), r);
  return r;
}

function normalizaFaixas(arr){
  return arr.map(f => typeof f === "string" ? {n: f, s: 0} : {n: f.n || "", s: Number(f.s) || 0});
}

const obs = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ obs.unobserve(e.target); carregaCapa(e.target); }
}), {rootMargin:"300px"});

async function carregaCapa(el){
  const d = el._disco;
  const poe = src => { 
    const i = new Image(); i.alt = `Capa de ${d.nome}`; i.className = "capa-base";
    i.onload = () => { el.textContent=""; el.append(i); }; 
    i.src = src; 
  };
  if(d.capa) return poe(d.capa);
  try{ const r = await infoAlbum(d); if(r.capa) poe(r.capa); }catch{}
}

  const ph = document.createElement("div"); ph.className = "res-placeholder"; ph.textContent = d.nome.charAt(0);
  const poeCapa = (src) => {
    if (!src) return;
    const img = document.createElement("img"); img.src = src; img.alt = d.nome;
    img.onload = () => { if (ph.parentNode) ph.replaceWith(img); };
  };
  if (d.capa) poeCapa(d.capa);
  else infoAlbum(d).then(r => { if (r.capa) poeCapa(r.capa); });
  return ph;
}

const tooltip = $("tooltip");
function posicionaTooltip(x, y){
  const pad = 14; const rect = tooltip.getBoundingClientRect();
  let left = x + pad, top = y + pad;
  if(left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
  if(top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
  tooltip.style.left = Math.max(8, left) + "px"; tooltip.style.top = Math.max(8, top) + "px";
}
function mostraTooltip(e, d){
  tooltip.innerHTML = `<b>${esc(d.nome)}</b><span>${esc(d.artista)}${d.ano ? " · " + d.ano : ""}</span>`;
  tooltip.classList.add("visivel"); tooltip.setAttribute("aria-hidden", "false");
  posicionaTooltip(e.clientX, e.clientY);
}
function escondeTooltip(){ tooltip.classList.remove("visivel"); tooltip.setAttribute("aria-hidden", "true"); }

function corParaCss(cores){
  const hexes = cores.map(c => CORES_HEX[c.toLowerCase()] || "#888888");
  if (hexes.length === 1) return hexes[0];
  const stops = hexes.map((hex, i) => {
    const start = (i / hexes.length) * 100; const end = ((i + 1) / hexes.length) * 100;
    return `${hex} ${start}%, ${hex} ${end}%`;
  }).join(", ");
  return `linear-gradient(135deg, ${stops})`;
}

const collator = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
const ordena = l => {
  return [...l].sort((a,b) => {
    const artA = semArtigo(a.artista), artB = semArtigo(b.artista);
    const cmpArt = collator.compare(artA, artB);
    if (cmpArt !== 0) return cmpArt;
    const anoA = a.ano || 0, anoB = b.ano || 0;
    if (anoA !== anoB) return anoA - anoB;
    return collator.compare(a.nome, b.nome);
  });
};

function opcoes(sel, rotulo, campo){
  const v = sel.value;
  const vals = [...new Set(discos.flatMap(d => [].concat(d[campo])).filter(Boolean))].sort((a,b) => collator.compare(semArtigo(a), semArtigo(b)));
  sel.innerHTML = `<option value="">${rotulo}</option>` + vals.map(x => `<option>${esc(x)}</option>`).join("");
  sel.value = v;
}

function desenhaFiltroLetrasDiscos(){
  const filtro = $("filtro-letras-discos"); filtro.textContent = "";
  ALFABETO.forEach(letra => {

    btn.className = "letra-btn" + (letraFiltroDisco === letra ? " ativo" : "");
    btn.textContent = letra; btn.setAttribute("aria-pressed", letraFiltroDisco === letra ? "true" : "false");
    btn.onclick = () => { letraFiltroDisco = (letraFiltroDisco === letra) ? null : letra; desenhaDiscos(); };
    filtro.append(btn);
  });
}

function desenhaDiscos(){
  const fa = $("f-artista").value, fg = $("f-genero").value, fc = $("f-cor").value;
  let l = discos.filter(d => (!fa||d.artista===fa) && (!fg||d.genero===fg) && (!fc||d.cor.includes(fc)));
  const total = l.length;

  if (letraFiltroDisco) {
    l = l.filter(d => {
      const primeira = semArtigo(d.artista).charAt(0).toLowerCase();
      const chave = /[a-z]/.test(primeira) ? primeira : "#";
      return chave === letraFiltroDisco;
    });
  }

  l = ordena(l);

  if (letraFiltroDisco) {
    if (l.length === 0) $("contagem-discos").textContent = `Nenhum disco com a letra "${letraFiltroDisco}" (de ${total} no total)`;
    else $("contagem-discos").textContent = `Mostrando ${l.length} ${l.length===1?"disco":"discos"} · letra ${letraFiltroDisco} (de ${total})`;
  } else {
    $("contagem-discos").textContent = `Mostrando ${total} ${total===1?"disco":"discos"}`;
  }

  desenhaFiltroLetrasDiscos();
  const g = $("grid"); g.textContent = "";
  if(!l.length){
    g.innerHTML = letraFiltroDisco ? `<p class="aviso">Nenhum disco com a letra "${esc(letraFiltroDisco)}" ainda.</p>` : '<p class="aviso">Nenhum disco com esses filtros.</p>';
    return;
  }

  l.forEach(d => {
    const b = document.createElement("button"); b.className = "disco";
    const c = document.createElement("div"); c.className = "capa"; c.textContent = d.nome; c._disco = d;
    const corNome = (d.cor[0] || "").toLowerCase();
    c.style.setProperty("--cor-disco", corParaCss(d.cor));
    if(corNome.includes("zoetrope")) c.classList.add("zoetrope");
    if(corNome.includes("splatter")) c.classList.add("splatter");
    if(corNome.includes("picture disc")) c.classList.add("picture-disc");
    
    b.append(c);
    b.onclick = () => abreDisco(d);
    b.addEventListener("mouseenter", e => mostraTooltip(e, d));
    b.addEventListener("mousemove", e => posicionaTooltip(e.clientX, e.clientY));
    b.addEventListener("mouseleave", escondeTooltip);
    g.append(b); obs.observe(c);
  });
}

function desenhaArtistas(){
  const artistas = [...new Set(discos.map(d => d.artista))].sort((a,b) => collator.compare(semArtigo(a), semArtigo(b)));
  const contagem = {}; discos.forEach(d => { contagem[d.artista] = (contagem[d.artista] || 0) + 1; });

  const grupos = {};
  artistas.forEach(nome => {
    const primeira = semArtigo(nome).charAt(0).toLowerCase();
    const chave = /[a-z]/.test(primeira) ? primeira : "#";
    (grupos[chave] = grupos[chave] || []).push(nome);
  });

  const total = artistas.length;
  const filtro = $("filtro-letras"); filtro.textContent = "";
  ALFABETO.forEach(letra => {
    const btn = document.createElement("button"); btn.type = "button";
    btn.className = "letra-btn" + (letraFiltroArtista === letra ? " ativo" : "");
    btn.textContent = letra;
    btn.onclick = () => { letraFiltroArtista = (letraFiltroArtista === letra) ? null : letra; desenhaArtistas(); };
    filtro.append(btn);
  });

  const g = $("grid-artistas"); g.textContent = "";

  if (letraFiltroArtista) {
    const nomes = grupos[letraFiltroArtista] || [];
    if (!nomes.length) {
      $("contagem-artistas").textContent = `Nenhum artista com a letra "${letraFiltroArtista}" ainda (de ${total} no total)`;
      g.innerHTML = `<p class="aviso">Nenhum artista com a letra "${esc(letraFiltroArtista)}" ainda.</p>`;
      return;
    }
    $("contagem-artistas").textContent = `Mostrando ${nomes.length} ${nomes.length===1?"artista":"artistas"} · letra ${letraFiltroArtista} (de ${total})`;

    const divisor = document.createElement("h2"); divisor.className = "divisor-letra"; divisor.textContent = letraFiltroArtista; g.append(divisor);
    nomes.forEach(nome => {
      const b = document.createElement("button"); b.className = "artista-item";
      const n = document.createElement("span"); n.className = "artista-nome"; n.textContent = nome;
      const c = document.createElement("span"); c.className = "artista-contagem"; c.textContent = `${contagem[nome]} ${contagem[nome]===1 ? "disco" : "discos"}`;
      b.append(n, c); b.onclick = () => abreArtista(nome); g.append(b);
    });
  } else {
    $("contagem-artistas").textContent = `Mostrando ${total} ${total===1?"artista":"artistas"}`;
    Object.keys(grupos).sort().forEach(letra => {
      const nomes = grupos[letra];
      if (!nomes.length) return;
      const divisor = document.createElement("h2"); divisor.className = "divisor-letra"; divisor.textContent = letra; g.append(divisor);
      nomes.forEach(nome => {
        const b = document.createElement("button"); b.className = "artista-item";
        const n = document.createElement("span"); n.className = "artista-nome"; n.textContent = nome;
        const c = document.createElement("span"); c.className = "artista-contagem"; c.textContent = `${contagem[nome]} ${contagem[nome]===1 ? "disco" : "discos"}`;
        b.append(n, c); b.onclick = () => abreArtista(nome); g.append(b);
      });
    });
  }
}

async function abreArtista(nome){
  const discs = ordena(discos.filter(d => d.artista === nome));
  $("m-nome").textContent = nome;
  $("m-info").textContent = `${discs.length} ${discs.length===1?"disco":"discos"} na coleção`;
  const cont = $("m-conteudo"); cont.textContent = "";

  discs.forEach(d => {
    const c = document.createElement("div"); c.className = "capa"; c.textContent = d.nome; c._disco = d;
    c.style.cursor = "pointer"; c.onclick = () => { fecharModal(); setTimeout(() => abreDisco(d), 100); };

    }).catch(()=>{});

}

let wsSalas = null;
let salasRemotas = null;
let wsKaraoke = null;
let filaAtual = [];
let salaAbertaId = null;
let salaAbertaEncerrada = false;

function conectarSalas(){
  if (wsSalas && (wsSalas.readyState === WebSocket.OPEN || wsSalas.readyState === WebSocket.CONNECTING)) return;

  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${protocolo}//${location.host}/api/karaoke/salas`;
  wsSalas = new WebSocket(url);

  wsSalas.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.tipo === "estado_inicial") {
        salasRemotas = msg.salas || [];
        desenhaSalas();
      } else if (msg.tipo === "salas_atualizadas") {
        salasRemotas = msg.salas || [];
        desenhaSalas();
        
        if (salaAbertaId) {
          const sAtual = salasRemotas.find(e => e.id === salaAbertaId);
          const estaEncerrada = sAtual ? sAtual.encerrado : false;
          
          if (estaEncerrada && !salaAbertaEncerrada) {
            salaAbertaEncerrada = true;
            const cont = $("m-conteudo");
            
            const form = cont.querySelector(".form-add");
            if (form) form.remove();
            const btnEnc = cont.querySelector(".btn-encerrar");
            if (btnEnc) btnEnc.remove();
            
            $("m-info").textContent = "Sala Encerrada";
            modalEl.classList.remove("modal-evento-ativo");
            modalEl.classList.add("modal-evento-encerrado");
          }
        }
      }
    } catch (e) { console.warn("Msg inválida (salas):", e); }
  };
  wsSalas.onerror = () => { console.warn("Erro no WS de salas"); };
  wsSalas.onclose = () => { wsSalas = null; };
}

function desenhaSalas(){
  if (salasRemotas === null) {
    $("contagem-salas").textContent = "Conectando…";
    $("lista-salas").innerHTML = '<p class="aviso">Conectando ao servidor…</p>';
    return;
  }
  
  const salas = [...salasRemotas];
  salas.sort((a,b) => a.id < b.id ? 1 : -1);
  
  $("contagem-salas").textContent = `Mostrando ${salas.length} ${salas.length===1?"sala":"salas"}`;
  const lista = $("lista-salas"); lista.textContent = "";
  if(!salas.length){
    lista.innerHTML = '<p class="aviso">Nenhuma sala ainda. Crie a primeira!</p>';
    return;
  }
  salas.forEach(sala => {
    const b = document.createElement("button");
    b.className = "evento-item";
    b.classList.add(sala.encerrado ? "encerrado" : "ativo");
    
    const legenda = `${sala.data} · ${sala.encerrado ? 'Encerrado' : 'Ativo'}`;
    b.innerHTML = `
      <div>
        <b style="text-transform: none;">${esc(sala.nome)}</b>
        <small>${esc(legenda)}</small>
      </div>
      <span>→</span>
    `;
    b.onclick = () => abrirSala(sala);
    lista.append(b);
  });
}

function novaSala(){
  const nome = prompt("Qual o nome da sala?");
  if(!nome) return;
  
  const agora = new Date();
  const dataStr = agora.toLocaleDateString('pt-BR');
  const id = "sala_" + Date.now();

  if (!wsSalas || wsSalas.readyState !== WebSocket.OPEN) {
    alert("Sem conexão com o servidor. Tente de novo em alguns segundos."); return;
  }
  
  wsSalas.send(JSON.stringify({ tipo: "criar_sala", id, nome, data: dataStr }));
}

function conectarKaraoke(id){
  if (wsKaraoke) { try { wsKaraoke.close(); } catch {} wsKaraoke = null; }
  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${protocolo}//${location.host}/api/karaoke/${encodeURIComponent(id)}`;
  wsKaraoke = new WebSocket(url);

  wsKaraoke.onopen = () => { $("m-info").textContent = salaAbertaEncerrada ? "Sala Encerrada" : "Conectado. Adicione seu nome à fila."; };
  wsKaraoke.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.tipo === "estado_inicial" || msg.tipo === "fila_atualizada") {
        filaAtual = msg.fila || [];
        renderizarFila(filaAtual);
      }
    } catch (e) { console.warn("Msg inválida (fila):", e); }
  };
  wsKaraoke.onerror = () => { $("m-info").textContent = "Erro de conexão. Recarregue a página."; };
  wsKaraoke.onclose = () => {};
}

function renderizarFila(fila){
  const ol = document.querySelector("#m-conteudo .fila-lista");
  if (!ol) return;
  ol.innerHTML = "";
  if (!fila.length) {
    const li = document.createElement("li");
    li.style.borderBottom = "0"; li.style.color = "var(--mute)";
    li.textContent = "Ninguém na fila ainda. Seja o primeiro!";
    ol.append(li); return;
  }
  
  fila.forEach((item, i) => {
    const li = document.createElement("li");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox"; checkbox.checked = !!item.cantou;
    
    if (salaAbertaEncerrada) {
      checkbox.disabled = true;
    } else {
      checkbox.onchange = () => {
        if (wsKaraoke && wsKaraoke.readyState === WebSocket.OPEN) {
          wsKaraoke.send(JSON.stringify({ tipo: "marcar_cantou", index: i, cantou: checkbox.checked }));
        }
      };
    }

    const num = document.createElement("span"); num.className = "num"; num.textContent = `${i+1}.`;
    
    const div = document.createElement("div");
    div.style.display = "flex";
    div.style.alignItems = "center";
    div.style.gap = "0.6rem";
    
    const avatarSrc = item.avatar || DEFAULT_AVATAR;
    div.innerHTML = `
      <img src="${avatarSrc}" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #ccc; cursor: pointer;" onclick="abrirPerfil('${esc(item.nome)}')">
      <div>
        <span class="nome" onclick="abrirPerfil('${esc(item.nome)}')">${esc(item.nome)}</span>
        <span class="musica">${esc(item.musica)}</span>
      </div>
    `;
    
    li.append(checkbox, num, div);

    if (!salaAbertaEncerrada && userProfile && item.nome === userProfile.username) {
      const btnLixeira = document.createElement("button");
      btnLixeira.className = "btn-lixeira";
      btnLixeira.innerHTML = "🗑️";
      btnLixeira.title = "Sair da fila";
      btnLixeira.onclick = () => {
        if (confirm(`Remover sua música (${item.musica}) da fila?`)) {
          if (wsKaraoke && wsKaraoke.readyState === WebSocket.OPEN) {
            wsKaraoke.send(JSON.stringify({ tipo: "sair_da_fila", index: i }));
          }
        }
      };
      li.append(btnLixeira);
    }

    if (item.cantou) li.style.opacity = "0.5";
    ol.append(li);
  });
}

function abrirSala(sala){
  escondeTooltip();
  salaAbertaId = sala.id;
  salaAbertaEncerrada = sala.encerrado;
  
  $("m-nome").textContent = sala.nome;
  $("m-info").textContent = sala.data;
  const cont = $("m-conteudo"); cont.textContent = "";
  
  modalEl.classList.remove("grande", "modal-evento-ativo", "modal-evento-encerrado");

  const ol = document.createElement("ol"); ol.className = "fila-lista"; cont.append(ol);

  if (!salaAbertaEncerrada) {
    modalEl.classList.add("modal-evento-ativo");
    
    const form = document.createElement("form"); form.className = "form-add";
    form.innerHTML = `
      <input type="text" placeholder="Música que vai cantar" required maxlength="100">
      <button type="submit">Entrar na fila</button>
    `;
    form.onsubmit = (e) => {
      e.preventDefault();
      const musica = form.querySelector("input").value.trim();
      
      if(!musica) return;
      if(!userProfile) {
        alert("Você precisa estar logado para entrar na fila.");
        return;
      }
      
      if(wsKaraoke && wsKaraoke.readyState === WebSocket.OPEN){
        wsKaraoke.send(JSON.stringify({ 
          tipo: "entrar_na_fila", 
          nome: userProfile.username,
          avatar: userProfile.avatar_url,
          musica: musica 
        }));
      }
      form.reset();
    };
    cont.append(form);

    const btnEncerrar = document.createElement("button");
    btnEncerrar.className = "btn-encerrar";
    btnEncerrar.textContent = "Encerrar Sala";
    btnEncerrar.onclick = () => {
      if (confirm("Tem certeza que deseja encerrar esta sala? Ninguém mais poderá entrar na fila.")) {
        if (wsSalas && wsSalas.readyState === WebSocket.OPEN) {
          wsSalas.send(JSON.stringify({ tipo: "encerrar_sala", id: salaAbertaId }));
        }
      }
    };
    cont.append(btnEncerrar);
  } else {
    modalEl.classList.add("modal-evento-encerrado");
    $("m-info").textContent = `${sala.data} · Encerrada`;
  }

  modalEl.showModal();
  conectarKaraoke(salaAbertaId);
}

$("nova-sala").onclick = novaSala;

async function abrirPerfil(username) {
  fecharMenu();
  const modalPerfil = $("modal-perfil");
  const wrapper = $("perfil-content-wrapper");
  wrapper.innerHTML = "<p style='padding: 2rem; text-align: center;'>Carregando perfil...</p>";
  modalPerfil.showModal();

  if (!window.supabase) return;

  const { data: profile, error } = await window.supabase
    .from('profiles')
    .select('*')
    .eq('username', username)
    .single();

  if (error || !profile) {
    wrapper.innerHTML = "<p style='padding: 2rem; text-align: center;'>Perfil não encontrado.</p>";
    return;
  }

  const dataObj = new Date(profile.created_at);
  const dataFormatada = dataObj.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const avatar = profile.avatar_url || DEFAULT_AVATAR;
  
  let capaStyle = "";
  let capaClass = "perfil-capa";
  if (profile.cover_url) {
    capaStyle = `background-image: url('${profile.cover_url}');`;
    capaClass += " com-imagem";
  }

  const headerHtml = `
    <div class="${capaClass}" style="${capaStyle}">
      <img src="${avatar}" alt="Foto de ${profile.username}" class="perfil-avatar">
      <h3>${esc(profile.username)}</h3>
      <p>Membro desde ${dataFormatada}</p>
    </div>
  `;

  let card2Html = "";
  let dicaFlipHtml = "";
  let flipContainerId = "";

  if (profile.lastfm_username) {
    flipContainerId = "id='flip-card'";
    dicaFlipHtml = `<div class="dica-flip">Clique no cartão para ver as estatísticas</div>`;
    
    card2Html = `
      <div class="flip-card-back">
        <div class="top-charts-wrapper">
          <div class="top-charts-header">
            <h3>Mais ouvidos da semana</h3>
          </div>
          
          <div class="carousel-container">
            <button class="carousel-btn prev" onclick="moveCarousel(-1, event)">‹</button>
            <div class="carousel-track" id="stats-carousel">
              
              <div class="carousel-slide">
                <div class="top-charts-col">
                  <h4>Músicas</h4>
                  <ol class="top-charts-list" id="top-tracks-list">
                    <li style="justify-content:center; color:var(--mute); border:none;">Carregando...</li>
                  </ol>
                </div>
              </div>

              <div class="carousel-slide">
                <div class="top-charts-col">
                  <h4>Álbuns</h4>
                  <ol class="top-charts-list" id="top-albums-list">
                    <li style="justify-content:center; color:var(--mute); border:none;">Carregando...</li>
                  </ol>
                </div>
              </div>

              <div class="carousel-slide">
                <div class="top-charts-col">
                  <h4>Artistas</h4>
                  <ol class="top-charts-list" id="top-artists-list">
                    <li style="justify-content:center; color:var(--mute); border:none;">Carregando...</li>
                  </ol>
                </div>
              </div>

            </div>
            <button class="carousel-btn next" onclick="moveCarousel(1, event)">›</button>
          </div>
          
          <div class="carousel-dots" id="carousel-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
          </div>

          <a href="https://www.last.fm/user/${encodeURIComponent(profile.lastfm_username)}" target="_blank" class="link-lastfm" onclick="event.stopPropagation()">Ir para perfil no Last.fm <span>→</span></a>
        </div>
      </div>
    `;
  }

  wrapper.innerHTML = `
    <div class="flip-card-container" ${flipContainerId}>
      <div class="flip-card-inner">
        
        <div class="flip-card-front">
          ${headerHtml}
          <div class="perfil-corpo">
            <div class="faixas-recentes-container" id="bloco-musica-card1">
              ${profile.lastfm_username ? 'Carregando faixas...' : '<div class="musica-bloco vazio">Nenhuma conta musical conectada</div>'}
            </div>
            ${dicaFlipHtml}
          </div>
        </div>

        ${card2Html}
        
      </div>
    </div>
  `;

  if (profile.lastfm_username) {
    const flipCard = $("flip-card");
    if (flipCard) {
      flipCard.addEventListener('click', (e) => {
        if(e.target.closest('.link-lastfm') || e.target.closest('.carousel-btn')) return;
        flipCard.classList.toggle('flipped');
      });
    }

    const track = $("stats-carousel");
    const dots = document.querySelectorAll('.carousel-dots span');
    if (track && dots.length) {
      track.addEventListener('scroll', () => {
        const index = Math.round(track.scrollLeft / track.clientWidth);
        dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
      });
    }
  }

  if (profile.lastfm_username) {
    const blocoMusica = $("bloco-musica-card1");

    fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getRecentTracks&user=${encodeURIComponent(profile.lastfm_username)}&api_key=${LASTFM_KEY}&format=json&limit=3`)
      .then(res => res.json())
      .then(data => {
        const tracks = (data.recenttracks?.track || []).slice(0, 3);
        if (tracks.length > 0) {
          let listaHtml = `<div class="faixas-recentes-titulo">Faixas recentes</div>`;
          tracks.forEach(track => {
            let coverUrl = "";
            if (track.image && track.image.length > 0) {
                for (let i = track.image.length - 1; i >= 0; i--) {
                    if (track.image[i]["#text"]) { coverUrl = track.image[i]["#text"]; break; }
                }
            }
            listaHtml += `
              <div class="faixa-item">
                ${coverUrl ? `<img src="${coverUrl}" class="faixa-cover" alt="Capa">` : `<div class="faixa-cover"></div>`}
                <div class="faixa-track" title="${esc(track.name)}">${esc(track.name)}</div>
                <div class="faixa-artist" title="${esc(track.artist['#text'])}">${esc(track.artist['#text'])}</div>
              </div>`;
          });
          blocoMusica.innerHTML = listaHtml;
        } else {
          blocoMusica.innerHTML = `<div class="musica-bloco vazio">Nenhuma faixa recente encontrada</div>`;
        }
      })
      .catch(() => { blocoMusica.innerHTML = `<div class="musica-bloco vazio">Erro ao carregar o Last.fm</div>`; });

    fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getTopTracks&user=${encodeURIComponent(profile.lastfm_username)}&api_key=${LASTFM_KEY}&format=json&limit=5&period=7day`)
      .then(res => res.json())
      .then(data => {
        const tracks = data.toptracks?.track || [];
        const ol = $("top-tracks-list");
        if (tracks.length > 0) {
          ol.innerHTML = tracks.map((t, i) => `
            <li>
              <span class="chart-num">${i+1}.</span>
              <div class="chart-info">
                <span class="chart-name" title="${esc(t.name)}">${esc(t.name)}</span>
                <span class="chart-artist" title="${esc(t.artist.name)}">${esc(t.artist.name)}</span>
              </div>
            </li>`).join("");
        } else { ol.innerHTML = "<li style='justify-content:center; border:none; color:var(--mute);'>Nenhuma música</li>"; }
      }).catch(() => { $("top-tracks-list").innerHTML = "<li style='justify-content:center; border:none;'>Erro ao carregar</li>"; });

    fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getTopAlbums&user=${encodeURIComponent(profile.lastfm_username)}&api_key=${LASTFM_KEY}&format=json&limit=5&period=7day`)
      .then(res => res.json())
      .then(data => {
        const albums = data.topalbums?.album || [];
        const ol = $("top-albums-list");
        if (albums.length > 0) {
          ol.innerHTML = albums.map((a, i) => {
            let cover = "";
            if (a.image && a.image.length > 0) {
              for (let j = a.image.length - 1; j >= 0; j--) {
                if (a.image[j]["#text"]) { cover = a.image[j]["#text"]; break; }
              }
            }
            return `
              <li>
                <span class="chart-num">${i+1}.</span>
                ${cover ? `<img src="${cover}" class="chart-cover" alt="Capa">` : `<div class="chart-cover"></div>`}
                <div class="chart-info">
                  <span class="chart-name" title="${esc(a.name)}">${esc(a.name)}</span>
                  <span class="chart-artist" title="${esc(a.artist.name)}">${esc(a.artist.name)}</span>
                </div>
              </li>`;
          }).join("");
        } else { ol.innerHTML = "<li style='justify-content:center; border:none; color:var(--mute);'>Nenhum álbum</li>"; }
      }).catch(() => { $("top-albums-list").innerHTML = "<li style='justify-content:center; border:none;'>Erro ao carregar</li>"; });

    fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getTopArtists&user=${encodeURIComponent(profile.lastfm_username)}&api_key=${LASTFM_KEY}&format=json&limit=5&period=7day`)
      .then(res => res.json())
      .then(data => {
        const artists = data.topartists?.artist || [];
        const ol = $("top-artists-list");
        if (artists.length > 0) {
          ol.innerHTML = artists.map((a, i) => `
            <li>
              <span class="chart-num">${i+1}.</span>
              <div class="chart-info" style="padding-left: 0.5rem;">
                <span class="chart-name" title="${esc(a.name)}">${esc(a.name)}</span>
              </div>
            </li>`).join("");
        } else { ol.innerHTML = "<li style='justify-content:center; border:none; color:var(--mute);'>Nenhum artista</li>"; }
      }).catch(() => { $("top-artists-list").innerHTML = "<li style='justify-content:center; border:none;'>Erro ao carregar</li>"; });
  }
}

window.abrirPerfil = abrirPerfil;
window.abrirPessoas = abrirPessoas;

window.moveCarousel = function(direction, event) {
  if (event) event.stopPropagation();
  const track = document.getElementById('stats-carousel');
  if (!track) return;
  const slideWidth = track.clientWidth;
  track.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
};

  try{
    let dados = DADOS;
    if(API_URL){
      try{

        if(r.ok) dados = await r.json();
      }catch{}
    }

    if (Array.isArray(dados)) discos = dados.map(norm);
    else discos = (dados.discos || []).map(norm);

    opcoes($("f-artista"),"Todos os artistas","artista");
    opcoes($("f-genero"),"Todos os gêneros","genero");
    opcoes($("f-cor"),"Todas as cores","cor");
    desenhaDiscos(); desenhaArtistas(); desenhaSalas();
  }catch(e){
    $("grid").innerHTML = '<p class="aviso">Não consegui carregar os discos. Verifique o arquivo discos.json.</p>';
  }

  let inicial = "discos";
  try {
    const daHash = location.hash.replace("#", "");
    const doStorage = localStorage.getItem("abaAtiva");
    if (tabs.includes(daHash)) inicial = daHash;
    else if (tabs.includes(doStorage)) inicial = doStorage;
  } catch {}
  
  if ((inicial === "karaoke" || inicial === "chat") && !currentUser) {
    inicial = "discos";
  }
  ativarTab(inicial);
}
