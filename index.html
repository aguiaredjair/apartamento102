<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sento em dois</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<style>
:root{
  --bg: #dedbd4;
  --ink: #22201d;
  --mute: #6b665e;
  --accent: #7c8266;
  --card: #efede8;
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
}
*{box-sizing:border-box; cursor:url('cursor.cur'), auto;}
body{margin:0;background:var(--bg);color:var(--ink)}
header{position:relative;padding:2.2rem 1.25rem 1rem;max-width:1200px;margin:auto}
h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.03em;text-align:center;color:var(--ink)}
.menu-btn{position:absolute;top:1rem;left:1.25rem;width:44px;height:44px;border:0;border-radius:6px;background:none;color:var(--ink);display:grid;place-content:center;gap:5px}
.menu-btn span{display:block;width:24px;height:2.5px;background:var(--ink);border-radius:2px}
.menu-btn:focus-visible{outline:2px solid var(--accent)}
.painel{position:absolute;top:4rem;left:1.25rem;z-index:5;width:min(280px,calc(100vw - 2.5rem));background:var(--card);border-radius:8px;padding:1rem;display:flex;flex-direction:column;gap:.6rem;box-shadow:0 12px 30px -10px #0006}
.painel[hidden]{display:none}
select,button.limpar{font:inherit;padding:.5rem .7rem;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:6px}
.tabs{display:flex;justify-content:center;gap:.5rem;padding:0 1.25rem 1rem;max-width:1200px;margin:auto}
.tab{font:inherit;font-weight:700;padding:.55rem 1.1rem;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;letter-spacing:.05em;font-size:.85rem}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.view{display:none}
.view.ativa{display:block}
main{max-width:1200px;margin:auto;padding:.5rem 1.25rem 4rem}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:1.2rem 1rem;align-items:start}
.disco{min-width:0;background:none;border:0;padding:0;text-align:center;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;display:block}
.disco:focus{outline:none}
.disco:focus-visible .capa{outline:2px solid var(--accent);outline-offset:3px}
.capa{position:relative;width:100%;min-width:0;aspect-ratio:1;overflow:hidden;display:grid;place-items:center;text-align:center;transition:transform .2s, border-radius .25s;color:var(--mute);font-weight:700;font-size:.7rem;padding:.5rem;overflow-wrap:anywhere;background:transparent}
.capa::before{content:"";position:absolute;inset:0;background:var(--cor-disco, transparent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:1;border-radius:inherit}
.capa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0;border-radius:inherit}
.disco:hover .capa{transform:translateY(-4px);border-radius:50%}
.disco:hover .capa::before{opacity:.5}
.capa.zoetrope::before{display:none !important}
.capa.zoetrope:hover{animation:girar 2s linear infinite}
.capa.splatter::before{display:none !important}
.capa.splatter:hover{animation:flipX 2s linear infinite}
@keyframes girar{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes flipX{from{transform:rotateX(0deg)}to{transform:rotateX(360deg)}}

.tooltip{
  position:fixed;top:0;left:0;
  background:var(--ink);color:var(--bg);
  padding:.55rem .8rem;border-radius:6px;
  font-size:.8rem;line-height:1.3;
  pointer-events:none;opacity:0;transition:opacity .12s;
  z-index:100;max-width:240px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.55);
}
.tooltip.visivel{opacity:1}
.tooltip b{display:block;font-weight:700;margin-bottom:.15rem;font-size:.85rem}
.tooltip span{display:block;opacity:.75;font-size:.75rem}

#grid-artistas{max-width:760px;margin:0 auto}
.divisor-letra{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:clamp(2.5rem,8vw,4rem);
  font-weight:800;line-height:1;
  color:var(--accent);
  margin:2.5rem 0 .4rem;
  padding-bottom:.4rem;
  border-bottom:3px solid var(--accent);
  letter-spacing:-.04em;
  text-transform:lowercase;
}
.divisor-letra:first-child{margin-top:0}
.artista-item{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:.7rem .5rem;border:0;
  border-bottom:1px solid rgba(34,32,29,.12);
  background:none;font:inherit;color:inherit;text-align:left;width:100%;
  transition:background .15s, padding-left .15s;
}
.artista-item:hover{background:rgba(124,130,102,.12);padding-left:1rem}
.artista-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.artista-nome{font-size:1.05rem;font-weight:700}
.artista-contagem{
  font-size:.75rem;color:var(--mute);background:var(--card);
  padding:.2rem .65rem;border-radius:999px;white-space:nowrap;
  border:1px solid rgba(34,32,29,.15);font-weight:600;
}

.legenda{text-align:center;color:var(--mute);font-size:.9rem;padding:.5rem 0 1.2rem}
.karaoke-wrap{max-width:640px;margin:auto}
.karaoke-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:.5rem;flex-wrap:wrap}
.karaoke-top .legenda{padding:0;margin:0}
.btn-primary{font:inherit;font-weight:700;padding:.6rem 1rem;border:0;background:var(--accent);color:#fff;border-radius:6px}
.lista-eventos{display:flex;flex-direction:column;gap:.6rem}
.evento-item{background:var(--card);border:0;font:inherit;color:inherit;text-align:left;padding:1rem;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%}
.evento-item:hover{outline:2px solid var(--accent);outline-offset:-2px}
.evento-item b{display:block;font-size:1rem;text-transform:capitalize}
.evento-item small{color:var(--mute);font-size:.8rem}
dialog{border:0;border-radius:8px;padding:0;width:min(520px,94vw);max-height:88vh;background:var(--card);color:var(--ink);overflow:auto}
dialog.grande{width:min(820px,94vw)}
dialog::backdrop{background:#000a}
.modal{padding:1.4rem}
.modal h2{margin:0;font-size:1.45rem;line-height:1.1;padding-right:2rem;text-transform:capitalize}
.modal p.sub{margin:.3rem 0 1rem;color:var(--mute);font-size:.88rem}
.fechar{float:right;font:inherit;border:0;background:none;font-size:1.6rem;color:var(--ink);line-height:1;padding:0}

/* ---------- CAPA GRANDE NO MODAL ---------- */
.capa-modal{
  display:block;
  width:100%;
  max-width:280px;
  aspect-ratio:1;
  object-fit:cover;
  margin:0 auto 1rem;
}

ol{padding-left:1.8rem;margin:.4rem 0}
li{padding:.25rem 0;border-bottom:1px solid #0002}
li small{color:var(--mute);float:right}
.grid-capas{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:1rem;margin-top:1rem}
.grid-capas .capa{font-size:.7rem;padding:.4rem}
.fila-lista{list-style:none;padding:0;margin:1rem 0}
.fila-lista li{padding:.65rem 0;border-bottom:1px solid #0002;display:flex;gap:.8rem;align-items:baseline;padding-left:0}
.fila-lista .num{font-weight:800;color:var(--accent);min-width:1.8rem;font-size:1rem}
.fila-lista .nome{font-weight:700;font-size:.95rem}
.fila-lista .musica{color:var(--mute);font-size:.82rem;display:block;margin-top:.1rem}
.fila-lista input[type="checkbox"]{width:1.2rem;height:1.2rem;accent-color:var(--accent);flex-shrink:0}
.form-add{display:flex;flex-direction:column;gap:.5rem;margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid #0002}
.form-add input{font:inherit;padding:.6rem .7rem;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:6px}
.form-add button{font:inherit;font-weight:700;padding:.6rem 1rem;border:0;background:var(--ink);color:var(--bg);border-radius:6px}
.aviso{grid-column:1/-1;color:var(--mute);text-align:center;padding:1rem}
@media(max-width:480px){
  .tabs{gap:.3rem}
  .tab{padding:.5rem .8rem;font-size:.78rem}
  .artista-item{padding:.6rem .3rem}
  .artista-nome{font-size:.95rem}
  #grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:1rem .8rem}
}
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menu-btn" aria-label="Filtros" aria-expanded="false" aria-controls="painel"><span></span><span></span><span></span></button>
  <h1>sento em dois</h1>
  <div class="painel" id="painel" hidden>
    <select id="f-artista" aria-label="Artista"></select>
    <select id="f-genero" aria-label="Gênero"></select>
    <select id="f-cor" aria-label="Cor"></select>
    <button class="limpar" id="limpar">Limpar filtros</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" id="tab-discos" aria-controls="view-discos" aria-selected="true">DISCOS</button>
  <button class="tab" role="tab" id="tab-artistas" aria-controls="view-artistas" aria-selected="false">ARTISTAS</button>
  <button class="tab" role="tab" id="tab-karaoke" aria-controls="view-karaoke" aria-selected="false">KARAOKÊ</button>
</nav>

<main>
  <section class="view ativa" id="view-discos" role="tabpanel" aria-labelledby="tab-discos">
    <p class="legenda" id="contagem-discos"></p>
    <div id="grid"><p class="aviso">Carregando discos…</p></div>
  </section>
  <section class="view" id="view-artistas" role="tabpanel" aria-labelledby="tab-artistas">
    <p class="legenda" id="contagem-artistas"></p>
    <div id="grid-artistas"></div>
  </section>
  <section class="view" id="view-karaoke" role="tabpanel" aria-labelledby="tab-karaoke">
    <div class="karaoke-wrap">
      <div class="karaoke-top">
        <p class="legenda" id="contagem-eventos"></p>
        <button class="btn-primary" id="novo-evento">+ Novo evento</button>
      </div>
      <div class="lista-eventos" id="lista-eventos"></div>
    </div>
  </section>
</main>

<div id="tooltip" class="tooltip" aria-hidden="true"></div>

<dialog id="modal"><div class="modal">
  <button class="fechar" aria-label="Fechar" onclick="fecharModal()">×</button>
  <h2 id="m-nome"></h2><p class="sub" id="m-info"></p><div id="m-conteudo"></div>
</div></dialog>

<script>
// ---- CONFIGURAÇÃO ----
const LASTFM_KEY = "76a09b3a6c3d66772961d2789ab87e8c";
const API_URL = "discos.json";
const DADOS = [];

const CORES_HEX = {
  "preto": "#000000", "branco": "#FFFFFF", "vermelho": "#FF0000",
  "rosa": "#FFC0CB", "azul": "#0000FF", "amarelo": "#FFFF00",
  "verde": "#008000", "verde-claro": "#90EE90", "verde neon": "#39FF14", "azul-claro": "#ADD8E6",
  "roxo": "#800080", "roxo translúcido": "#80008080", "laranja": "#FFA500",
  "laranja translúcido": "#FFA50080", "cinza": "#808080",
  "dourado": "#FFD700", "marrom": "#8B4513",
  "rosa translúcido": "#FFC0CB80", "amarelo translúcido": "#FFFF0080",
  "preto translúcido": "#00000080", "azul translúcido": "#0000FF80",
  "verde translúcido": "#00800080", "clear": "#E0E0E0",
  "picture disc": "#C0C0C0", "splatter": "#FF69B4", "zoetrope": "#9370DB"
};

const $ = id => document.getElementById(id);
const norm = d => ({
  nome: d.nome ?? d.name ?? "", artista: d.artista ?? d.artist ?? "",
  ano: Number(d.ano ?? d.year) || 0, genero: d.genero ?? d["gênero"] ?? d.genre ?? "",
  cor: [].concat(d.cor ?? d.color ?? []).filter(Boolean), capa: d.capa ?? ""
});
const semArtigo = s => s
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/^(the|an?|os?|as)\s+(?=\S)/i, "");
const cmp = (a,b) => a.localeCompare(b,"pt-BR",{sensitivity:"base"});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let discos = [];

const painel = $("painel"), btnMenu = $("menu-btn");
const menu = abrir => { painel.hidden = !abrir; btnMenu.setAttribute("aria-expanded", abrir); };
btnMenu.onclick = e => { e.stopPropagation(); menu(painel.hidden); };
document.addEventListener("click", e => { if(!painel.hidden && !painel.contains(e.target) && e.target !== btnMenu) menu(false); });
document.addEventListener("keydown", e => { if(e.key==="Escape") menu(false); });

const tabs = ["discos","artistas","karaoke"];
function ativarTab(nome){
  tabs.forEach(t => {
    const el = $("tab-"+t), view = $("view-"+t);
    const on = t === nome;
    el.setAttribute("aria-selected", on);
    view.classList.toggle("ativa", on);
  });
  btnMenu.style.display = nome === "karaoke" ? "none" : "";
  if (nome === "karaoke") { painel.hidden = true; btnMenu.setAttribute("aria-expanded", false); }
  if (nome === "artistas") desenhaArtistas();
  if (nome === "karaoke") { conectarEventos(); desenhaKaraoke(); }

  try { localStorage.setItem("abaAtiva", nome); } catch {}
  if (location.hash !== "#" + nome) history.replaceState(null, "", "#" + nome);
}
tabs.forEach(t => $("tab-"+t).onclick = () => ativarTab(t));

const cache = {
  get(k){ try{ return JSON.parse(localStorage.getItem("dc:"+k)); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem("dc:"+k, JSON.stringify(v)); }catch{} }
};
const chaveAlbum = d => "lf:"+(d.artista+"|"+d.nome).toLowerCase();

// ---------- LAST.FM ----------
async function infoAlbum(d){
  const c = cache.get(chaveAlbum(d)); if(c) return c;
  const u = `https://ws.audioscrobbler.com/2.0/?method=album.getInfo&api_key=${LASTFM_KEY}&artist=${encodeURIComponent(d.artista)}&album=${encodeURIComponent(d.nome)}&autocorrect=1&format=json`;
  const data = await (await fetch(u)).json();
  const a = data.album;
  if(!a) return {capa:"",faixas:[]};
  const imgs = (a.image||[]).map(i => i["#text"]).filter(x => x && !x.includes("2a96cbd8b46e442fc41c2b86b821562f"));
  const r = {capa: imgs[imgs.length-1]||"", faixas: [].concat(a.tracks?.track||[]).map(t => ({n:t.name, s:Number(t.duration)||0}))};
  cache.set(chaveAlbum(d), r);
  return r;
}

// ---------- CAPAS ----------
const obs = new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ obs.unobserve(e.target); carregaCapa(e.target); }
}), {rootMargin:"300px"});

async function carregaCapa(el){
  const d = el._disco;
  const poe = src => { const i = new Image(); i.alt = `Capa de ${d.nome}`; i.onload = () => { el.textContent=""; el.append(i); }; i.src = src; };
  if(d.capa) return poe(d.capa);
  if(!LASTFM_KEY) return;
  try{ const r = await infoAlbum(d); if(r.capa) poe(r.capa); }catch{}
}

// ---------- TOOLTIP ----------
const tooltip = $("tooltip");
function posicionaTooltip(x, y){
  const pad = 14;
  const rect = tooltip.getBoundingClientRect();
  let left = x + pad, top = y + pad;
  if(left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
  if(top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, top) + "px";
}
function mostraTooltip(e, d){
  tooltip.innerHTML = `<b>${esc(d.nome)}</b><span>${esc(d.artista)}${d.ano ? " · " + d.ano : ""}</span>`;
  tooltip.classList.add("visivel");
  tooltip.setAttribute("aria-hidden", "false");
  posicionaTooltip(e.clientX, e.clientY);
}
function escondeTooltip(){
  tooltip.classList.remove("visivel");
  tooltip.setAttribute("aria-hidden", "true");
}

// ---------- MODAL ----------
const modalEl = $("modal");
window.fecharModal = () => {
  if (wsKaraoke) { try { wsKaraoke.close(); } catch {} wsKaraoke = null; }
  modalEl.classList.remove("grande");
  modalEl.close();
};
modalEl.addEventListener("click", e => { if (e.target === modalEl) fecharModal(); });

const fmt = s => s ? Math.floor(s/60)+":"+String(s%60).padStart(2,"0") : "";

async function abreDisco(d){
  escondeTooltip();
  $("m-nome").textContent = d.nome;
  $("m-info").textContent = `${d.artista} · ${d.ano || "ano não informado"} · ${d.genero} · ${d.cor.join(", ")}`;
  const cont = $("m-conteudo");
  cont.textContent = LASTFM_KEY ? "Buscando tracklist…" : "Falta a chave do Last.fm.";
  modalEl.classList.remove("grande");
  modalEl.showModal();
  if(!LASTFM_KEY) return;

  try{
    const {capa, faixas} = await infoAlbum(d);
    cont.textContent = "";

    if(capa){
      const img = document.createElement("img");
      img.src = capa;
      img.alt = `Capa de ${d.nome}`;
      img.className = "capa-modal";
      cont.append(img);
    }

    if(!faixas.length){
      if(!capa){
        cont.textContent = "Não encontrei informações deste disco no Last.fm.";
      } else {
        const p = document.createElement("p");
        p.textContent = "Tracklist não encontrada.";
        p.style.textAlign = "center";
        p.style.color = "var(--mute)";
        p.style.fontSize = ".85rem";
        cont.append(p);
      }
      return;
    }

    const ol = document.createElement("ol");
    faixas.forEach(f => {
      const li = document.createElement("li");
      li.textContent = f.n;
      if(f.s){ const s = document.createElement("small"); s.textContent = fmt(f.s); li.append(s); }
      ol.append(li);
    });
    cont.append(ol);

  }catch{
    cont.textContent = "Não consegui carregar este disco do Last.fm.";
  }
}

const ordena = l => [...l].sort((a,b) => cmp(semArtigo(a.artista),semArtigo(b.artista)) || a.ano - b.ano || cmp(a.nome,b.nome));

function opcoes(sel, rotulo, campo){
  const v = sel.value;
  const vals = [...new Set(discos.flatMap(d => [].concat(d[campo])).filter(Boolean))].sort((a,b) => cmp(semArtigo(a),semArtigo(b)));
  sel.innerHTML = `<option value="">${rotulo}</option>` + vals.map(x => `<option>${esc(x)}</option>`).join("");
  sel.value = v;
}

function desenhaDiscos(){
  const fa = $("f-artista").value, fg = $("f-genero").value, fc = $("f-cor").value;
  const l = ordena(discos.filter(d => (!fa||d.artista===fa) && (!fg||d.genero===fg) && (!fc||d.cor.includes(fc))));
  $("contagem-discos").textContent = `Mostrando ${l.length} ${l.length===1?"disco":"discos"}`;
  const g = $("grid"); g.textContent = "";
  if(!l.length){ g.innerHTML = '<p class="aviso">Nenhum disco com esses filtros.</p>'; return; }
  l.forEach(d => {
    const b = document.createElement("button"); b.className = "disco";
    const c = document.createElement("div"); c.className = "capa"; c.textContent = d.nome; c._disco = d;
    const corNome = (d.cor[0] || "").toLowerCase();
    c.style.setProperty("--cor-disco", CORES_HEX[corNome] || "#888888");
    if(corNome.includes("zoetrope")) c.classList.add("zoetrope");
    if(corNome.includes("splatter")) c.classList.add("splatter");
    b.append(c);
    b.onclick = () => abreDisco(d);
    b.addEventListener("mouseenter", e => mostraTooltip(e, d));
    b.addEventListener("mousemove", e => posicionaTooltip(e.clientX, e.clientY));
    b.addEventListener("mouseleave", escondeTooltip);
    g.append(b);
    obs.observe(c);
  });
}

["f-artista","f-genero","f-cor"].forEach(id => $(id).onchange = desenhaDiscos);
$("limpar").onclick = () => { ["f-artista","f-genero","f-cor"].forEach(id => $(id).value=""); desenhaDiscos(); };

// ---------- ARTISTAS ----------
function desenhaArtistas(){
  const artistas = [...new Set(discos.map(d => d.artista))].sort((a,b) => cmp(semArtigo(a),semArtigo(b)));
  $("contagem-artistas").textContent = `Mostrando ${artistas.length} ${artistas.length===1?"artista":"artistas"}`;

  const contagem = {};
  discos.forEach(d => { contagem[d.artista] = (contagem[d.artista] || 0) + 1; });

  const grupos = {};
  artistas.forEach(nome => {
    const primeira = semArtigo(nome).charAt(0).toLowerCase();
    const chave = /[a-z]/.test(primeira) ? primeira : "#";
    (grupos[chave] = grupos[chave] || []).push(nome);
  });

  const g = $("grid-artistas");
  g.textContent = "";

  Object.keys(grupos).sort().forEach(letra => {
    const divisor = document.createElement("h2");
    divisor.className = "divisor-letra";
    divisor.textContent = letra.toLowerCase();
    g.append(divisor);

    grupos[letra].forEach(nome => {
      const b = document.createElement("button");
      b.className = "artista-item";
      const n = document.createElement("span");
      n.className = "artista-nome";
      n.textContent = nome;
      const c = document.createElement("span");
      c.className = "artista-contagem";
      c.textContent = `${contagem[nome]} ${contagem[nome]===1 ? "disco" : "discos"}`;
      b.append(n, c);
      b.onclick = () => abreArtista(nome);
      g.append(b);
    });
  });
}

function abreArtista(nome){
  const discs = ordena(discos.filter(d => d.artista === nome));
  $("m-nome").textContent = nome;
  $("m-info").textContent = `${discs.length} ${discs.length===1?"disco":"discos"} na coleção`;
  const cont = $("m-conteudo"); cont.textContent = "";
  const grid = document.createElement("div"); grid.className = "grid-capas";
  discs.forEach(d => {
    const c = document.createElement("div"); c.className = "capa"; c.textContent = d.nome; c._disco = d;
    c.style.cursor = "pointer";
    c.onclick = () => { fecharModal(); setTimeout(() => abreDisco(d), 100); };
    grid.append(c);
    infoAlbum(d).then(r => {
      if(r.capa){
        const i = new Image(); i.alt = `Capa de ${d.nome}`;
        i.onload = () => { c.textContent=""; c.append(i); };
        i.src = r.capa;
      }
    }).catch(()=>{});
  });
  cont.append(grid);
  modalEl.classList.add("grande");
  modalEl.showModal();
}

// ---------- KARAOKÊ (lista de eventos + filas via WebSocket) ----------
const KARAOKE_KEY = "karaoke:eventos"; // legado, só para migração
const loadEventos = () => { try { return JSON.parse(localStorage.getItem(KARAOKE_KEY)) || []; } catch { return []; } };
const saveEventos = ev => { try { localStorage.setItem(KARAOKE_KEY, JSON.stringify(ev)); } catch {} };

let wsEventos = null;
let eventosRemotos = null;
let wsKaraoke = null;
let filaAtual = [];

function fmtDataLonga(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d).toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long", year:"numeric"});
}

function conectarEventos(){
  if (wsEventos && (wsEventos.readyState === WebSocket.OPEN || wsEventos.readyState === WebSocket.CONNECTING)) return;

  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${protocolo}//${location.host}/api/karaoke/eventos`;
  wsEventos = new WebSocket(url);

  wsEventos.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.tipo === "estado_inicial") {
        eventosRemotos = msg.eventos || [];
        migrarEventosLocais();
        desenhaKaraoke();
      } else if (msg.tipo === "eventos_atualizados") {
        eventosRemotos = msg.eventos || [];
        desenhaKaraoke();
      }
    } catch (e) { console.warn("Mensagem inválida (eventos):", e); }
  };
  wsEventos.onerror = () => { console.warn("Erro no WebSocket de eventos"); };
  wsEventos.onclose = () => { wsEventos = null; };
}

function migrarEventosLocais(){
  if (!eventosRemotos) return;
  const locais = loadEventos();
  if (!locais.length) return;

  let algoMigrado = false;
  locais.forEach(ev => {
    if (!eventosRemotos.includes(ev.data)) {
      if (wsEventos && wsEventos.readyState === WebSocket.OPEN) {
        wsEventos.send(JSON.stringify({ tipo: "criar_evento", data: ev.data }));
        algoMigrado = true;
      }
    }
  });

  const todosNoServidor = locais.every(ev => eventosRemotos.includes(ev.data));
  if (algoMigrado || todosNoServidor) saveEventos([]);
}

function desenhaKaraoke(){
  if (eventosRemotos === null) {
    $("contagem-eventos").textContent = "Conectando…";
    $("lista-eventos").innerHTML = '<p class="aviso">Conectando ao servidor…</p>';
    return;
  }
  const eventos = eventosRemotos.slice().sort((a,b) => a < b ? 1 : -1);
  $("contagem-eventos").textContent = `Mostrando ${eventos.length} ${eventos.length===1?"evento":"eventos"}`;
  const lista = $("lista-eventos"); lista.textContent = "";
  if(!eventos.length){
    lista.innerHTML = '<p class="aviso">Nenhum evento ainda. Crie o primeiro!</p>';
    return;
  }
  eventos.forEach(data => {
    const b = document.createElement("button"); b.className = "evento-item";
    b.innerHTML = `<div><b>${esc(fmtDataLonga(data))}</b><small>abrir fila →</small></div><span>→</span>`;
    b.onclick = () => abrirEvento(data);
    lista.append(b);
  });
}

function novoEvento(){
  const hoje = new Date().toISOString().slice(0,10);
  const data = prompt("Data do evento (AAAA-MM-DD):", hoje);
  if(!data) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){ alert("Data inválida. Use AAAA-MM-DD."); return; }

  if (!wsEventos || wsEventos.readyState !== WebSocket.OPEN) {
    alert("Sem conexão com o servidor. Tente de novo em alguns segundos.");
    return;
  }
  if (eventosRemotos && eventosRemotos.includes(data)) {
    alert("Já existe um evento nessa data.");
    return;
  }
  wsEventos.send(JSON.stringify({ tipo: "criar_evento", data }));
}

function conectarKaraoke(data){
  if (wsKaraoke) { try { wsKaraoke.close(); } catch {} wsKaraoke = null; }

  const protocolo = location.protocol === "https:" ? "wss:" : "ws:";
  const url = `${protocolo}//${location.host}/api/karaoke/${encodeURIComponent(data)}`;
  wsKaraoke = new WebSocket(url);

  wsKaraoke.onopen = () => { $("m-info").textContent = "Conectado. Adicione seu nome à fila."; };
  wsKaraoke.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      if (msg.tipo === "estado_inicial" || msg.tipo === "fila_atualizada") {
        filaAtual = msg.fila || [];
        renderizarFila(filaAtual);
      }
    } catch (e) { console.warn("Mensagem inválida (fila):", e); }
  };
  wsKaraoke.onerror = () => { $("m-info").textContent = "Erro de conexão. Recarregue a página."; };
  wsKaraoke.onclose = () => {};
}

function renderizarFila(fila){
  const ol = document.querySelector("#m-conteudo .fila-lista");
  if (!ol) return;
  ol.innerHTML = "";
  if (!fila.length) {
    const li = document.createElement("li");
    li.style.borderBottom = "0";
    li.style.color = "var(--mute)";
    li.textContent = "Ninguém na fila ainda. Seja o primeiro!";
    ol.append(li);
    return;
  }
  fila.forEach((item, i) => {
    const li = document.createElement("li");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !!item.cantou;
    checkbox.onchange = () => {
      if (wsKaraoke && wsKaraoke.readyState === WebSocket.OPEN) {
        wsKaraoke.send(JSON.stringify({ tipo: "marcar_cantou", index: i, cantou: checkbox.checked }));
      }
    };
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = `${i+1}.`;
    const div = document.createElement("div");
    div.innerHTML = `<span class="nome">${esc(item.nome)}</span><span class="musica">${esc(item.musica)}</span>`;
    li.append(checkbox, num, div);
    if (item.cantou) li.style.opacity = "0.5";
    ol.append(li);
  });
}

function abrirEvento(data){
  escondeTooltip();

  $("m-nome").textContent = fmtDataLonga(data);
  $("m-info").textContent = "Conectando à fila…";
  const cont = $("m-conteudo"); cont.textContent = "";

  const ol = document.createElement("ol");
  ol.className = "fila-lista";
  cont.append(ol);

  const form = document.createElement("form");
  form.className = "form-add";
  form.innerHTML = `
    <input type="text" placeholder="Seu nome" required maxlength="40">
    <input type="text" placeholder="Música que vai cantar" required maxlength="100">
    <button type="submit">Entrar na fila</button>
  `;
  form.onsubmit = (e) => {
    e.preventDefault();
    const inputs = form.querySelectorAll("input");
    const nome = inputs[0].value.trim();
    const musica = inputs[1].value.trim();
    if(!nome || !musica) return;
    if(wsKaraoke && wsKaraoke.readyState === WebSocket.OPEN){
      wsKaraoke.send(JSON.stringify({ tipo: "entrar_na_fila", nome, musica }));
    }
    form.reset();
  };
  cont.append(form);

  modalEl.classList.remove("grande");
  modalEl.showModal();
  conectarKaraoke(data);
}

$("novo-evento").onclick = novoEvento;

// ---------- INIT ----------
async function init(){
  try{
    let dados = DADOS;
    if(API_URL){
      try{
        const r = await fetch(API_URL);
        if(r.ok) dados = await r.json();
      }catch{}
    }
    discos = (Array.isArray(dados) ? dados : dados.discos || []).map(norm);
    opcoes($("f-artista"),"Todos os artistas","artista");
    opcoes($("f-genero"),"Todos os gêneros","genero");
    opcoes($("f-cor"),"Todas as cores","cor");
    desenhaDiscos();
    desenhaArtistas();
    desenhaKaraoke();
  }catch(e){
    $("grid").innerHTML = '<p class="aviso">Não consegui carregar os discos. Verifique o arquivo discos.json.</p>';
  }

  let inicial = "discos";
  try {
    const daHash = location.hash.replace("#", "");
    const doStorage = localStorage.getItem("abaAtiva");
    if (tabs.includes(daHash)) inicial = daHash;
    else if (tabs.includes(doStorage)) inicial = doStorage;
  } catch {}
  ativarTab(inicial);
}
init();
